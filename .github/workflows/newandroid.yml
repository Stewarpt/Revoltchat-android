name: Android CI

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
    - name: Install Deno
      run: curl -fsSL https://deno.land/install.sh | sh
    - name: Install Deno Deps
      run: deno run -A scripts/download_deps.ts -y
    - name: Copy build.properties
      run: cp stoatbuild.properties.example stoatbuild.properties
    - name: Copy sentry.properties
      run: cp sentry.properties.example sentry.properties
    - name: Copy google-services.json
      run: cp app/google-services.json.example app/google-services.json
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew assembleDebug --no-daemon
